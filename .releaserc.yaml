plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: "conventionalcommits"
  - - "@semantic-release/release-notes-generator"
    - preset: "conventionalcommits"
  - - "@semantic-release/github"
    - successCommentCondition: false

  - "semantic-release-major-tag"

  # Update dist, in case Dependabot PRs merged without doing so
  - - "@semantic-release/exec"
    - prepareCmd: "pnpm install && pnpm run build"

  # Two bundles: the action's main (acquire) and its post (release)
  - - "@semantic-release/git"
    - assets:
        - "dist/acquire/index.js"
        - "dist/release/index.js"
      message: "chore(release): build dist"

branches:
  - main
  - name: rc/*
    prerelease: '${name.replace(/^rc\//, "rc-")}'
